# docker-compose.yml
services:
  pg:
    image: timescale/timescaledb:2.16.0-pg16   # 纯 Postgres 用 postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
      POSTGRES_DB: appdb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  grafana:
    image: grafana_with_data:latest
    container_name: grafana_with_data
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata: {}
  grafana-storage:
